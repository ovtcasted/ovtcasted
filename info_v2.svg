<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%">
  <style>
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      94% { transform: translate(0, 0); }
      95% { transform: translate(-2px, 1px); }
      96% { transform: translate(2px, -1px); }
      97% { transform: translate(-1px, 0); }
      98% { transform: translate(1px, 0); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 1; }
      51% { opacity: 0.8; }
      52% { opacity: 1; }
    }
    .glitch-text {
      fill: #8B0000;
      animation: shake 3s infinite, flicker 3s infinite;
      text-shadow: 2px 0 0 #FF0000, -2px 0 0 #00FFFF;
    }
  </style>
  <rect width="100%" height="100%" fill="#050505" />
  
  <text x="50%" text-anchor="middle" font-family="Courier New, monospace" font-size="18" class="glitch-text">
    <tspan x="50%" y="45">acc. #ovtcasted</tspan>
    <tspan x="50%" y="75">update : frontend developer</tspan>
    <tspan x="50%" y="115">vampir ✠ e @ovtcasted</tspan>
    <tspan x="50%" y="145">html // css // python ✠ frontend . 100%</tspan>
    <tspan x="50%" y="175">total commits: 14 ; streak: 2 days</tspan>
    <tspan x="50%" y="215">// status: online</tspan>
    <tspan x="50%" y="245">// role: frontend developer</tspan>
    <tspan x="50%" y="275">// stack: html, css, python</tspan>
    <tspan x="50%" y="305">// system: active</tspan>
  </text>
</svg>
