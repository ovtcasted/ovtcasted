<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%">
  <style>
    /* Анимация основного текста (легкое мерцание) */
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      2% { opacity: 0.3; }
      4% { opacity: 1; }
      50% { opacity: 1; }
      52% { opacity: 0.8; }
      54% { opacity: 1; }
    }
    
    /* Анимация красного слоя (дергается в стороны) */
    @keyframes glitch-red {
      0%, 100% { transform: translate(0); opacity: 0; }
      2% { transform: translate(-2px, 1px); opacity: 0.8; }
      4% { transform: translate(2px, -1px); opacity: 0.8; }
      6% { transform: translate(0); opacity: 0; }
      94% { transform: translate(0); opacity: 0; }
      96% { transform: translate(2px, 1px); opacity: 0.8; }
      98% { transform: translate(-2px, -1px); opacity: 0.8; }
    }

    .text-main {
      animation: flicker 4s infinite;
    }
    .text-glitch {
      fill: #FF0000;
      animation: glitch-red 3s infinite;
    }
  </style>

  <rect width="100%" height="100%" fill="#050505" />

  <!-- Слой с глитчем (дергается) -->
  <text x="50%" text-anchor="middle" font-family="Courier New, monospace" font-size="18" class="text-glitch">
    <tspan x="50%" y="45">acc. #ovtcasted</tspan>
    <tspan x="50%" y="75">update : frontend developer</tspan>
    <tspan x="50%" y="115">vampir ✠ e @ovtcasted</tspan>
    <tspan x="50%" y="145">html // css // python ✠ frontend . 100%</tspan>
    <tspan x="50%" y="175">total commits: 14 ; streak: 2 days</tspan>
    <tspan x="50%" y="215">// status: online</tspan>
    <tspan x="50%" y="245">// role: frontend developer</tspan>
    <tspan x="50%" y="275">// stack: html, css, python</tspan>
    <tspan x="50%" y="305">// system: active</tspan>
  </text>

  <!-- Основной слой (мерцает) -->
  <text x="50%" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#8B0000" class="text-main">
    <tspan x="50%" y="45">acc. #ovtcasted</tspan>
    <tspan x="50%" y="75">update : frontend developer</tspan>
    <tspan x="50%" y="115">vampir ✠ e @ovtcasted</tspan>
    <tspan x="50%" y="145">html // css // python ✠ frontend . 100%</tspan>
    <tspan x="50%" y="175">total commits: 14 ; streak: 2 days</tspan>
    <tspan x="50%" y="215">// status: online</tspan>
    <tspan x="50%" y="245">// role: frontend developer</tspan>
    <tspan x="50%" y="275">// stack: html, css, python</tspan>
    <tspan x="50%" y="305">// system: active</tspan>
  </text>
</svg>
