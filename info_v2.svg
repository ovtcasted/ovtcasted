<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%">
  <style>
    @keyframes scan {
      0% { transform: translateY(-30px); }
      100% { transform: translateY(340px); }
    }
    @keyframes shake {
      0%, 90%, 100% { transform: translateX(0); }
      92% { transform: translateX(-2px); }
      94% { transform: translateX(2px); }
      96% { transform: translateX(-1px); }
      98% { transform: translateX(1px); }
    }
    .text-layer {
      fill: #8B0000;
      animation: shake 5s infinite;
    }
    .scanline {
      fill: rgba(255, 0, 0, 0.15);
      animation: scan 3s linear infinite;
    }
  </style>
  
  <rect width="100%" height="100%" fill="#050505" />
  
  <text x="50%" text-anchor="middle" font-family="Courier New, monospace" font-size="18" class="text-layer">
    <tspan x="50%" y="45">acc. #ovtcasted</tspan>
    <tspan x="50%" y="75">update : frontend developer</tspan>
    <tspan x="50%" y="115">vampir ✠ e @ovtcasted</tspan>
    <tspan x="50%" y="145">html // css // python ✠ frontend . 100%</tspan>
    <tspan x="50%" y="175">total commits: 14 ; streak: 2 days</tspan>
    <tspan x="50%" y="215">// status: online</tspan>
    <tspan x="50%" y="245">// role: frontend developer</tspan>
    <tspan x="50%" y="275">// stack: html, css, python</tspan>
    <tspan x="50%" y="305">// system: active</tspan>
  </text>

  <rect x="0" y="0" width="100%" height="20" class="scanline" />
</svg>
