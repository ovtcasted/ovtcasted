<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%">
  <style>
    @keyframes glitch-anim-1 {
      0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
      10% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
      20% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
      30% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -1px); }
      40% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
      100% { clip-path: inset(0 0 0 0); transform: translate(0); }
    }
    @keyframes text-shake {
      0%, 100% { transform: translate(0); }
      94% { transform: translate(0); }
      95% { transform: translate(-2px, 1px); }
      96% { transform: translate(2px, -1px); }
      97% { transform: translate(-1px, 0); }
    }
    .layer-red {
      fill: #FF0000;
      animation: glitch-anim-1 3s infinite linear alternate-reverse;
    }
    .layer-cyan {
      fill: #00FFFF;
      animation: glitch-anim-1 3s infinite linear alternate-reverse;
      animation-delay: 0.1s;
    }
    .layer-main {
      fill: #8B0000;
      animation: text-shake 4s infinite;
    }
  </style>
  <rect width="100%" height="100%" fill="#050505" />
  
  <!-- Красный слой -->
  <text x="50%" text-anchor="middle" font-family="Courier New, monospace" font-size="18" class="layer-red">
    <tspan x="50%" y="45">acc. #ovtcasted</tspan>
    <tspan x="50%" y="75">update : frontend developer</tspan>
    <tspan x="50%" y="115">vampir ✠ e @ovtcasted</tspan>
    <tspan x="50%" y="145">html // css // python ✠ frontend . 100%</tspan>
    <tspan x="50%" y="175">total commits: 14 ; streak: 2 days</tspan>
    <tspan x="50%" y="215">// status: online</tspan>
    <tspan x="50%" y="245">// role: frontend developer</tspan>
    <tspan x="50%" y="275">// stack: html, css, python</tspan>
    <tspan x="50%" y="305">// system: active</tspan>
  </text>
  
  <!-- Бирюзовый слой -->
  <text x="50%" text-anchor="middle" font-family="Courier New, monospace" font-size="18" class="layer-cyan">
    <tspan x="50%" y="45">acc. #ovtcasted</tspan>
    <tspan x="50%" y="75">update : frontend developer</tspan>
    <tspan x="50%" y="115">vampir ✠ e @ovtcasted</tspan>
    <tspan x="50%" y="145">html // css // python ✠ frontend . 100%</tspan>
    <tspan x="50%" y="175">total commits: 14 ; streak: 2 days</tspan>
    <tspan x="50%" y="215">// status: online</tspan>
    <tspan x="50%" y="245">// role: frontend developer</tspan>
    <tspan x="50%" y="275">// stack: html, css, python</tspan>
    <tspan x="50%" y="305">// system: active</tspan>
  </text>

  <!-- Основной темно-красный слой (поверх) -->
  <text x="50%" text-anchor="middle" font-family="Courier New, monospace" font-size="18" class="layer-main">
    <tspan x="50%" y="45">acc. #ovtcasted</tspan>
    <tspan x="50%" y="75">update : frontend developer</tspan>
    <tspan x="50%" y="115">vampir ✠ e @ovtcasted</tspan>
    <tspan x="50%" y="145">html // css // python ✠ frontend . 100%</tspan>
    <tspan x="50%" y="175">total commits: 14 ; streak: 2 days</tspan>
    <tspan x="50%" y="215">// status: online</tspan>
    <tspan x="50%" y="245">// role: frontend developer</tspan>
    <tspan x="50%" y="275">// stack: html, css, python</tspan>
    <tspan x="50%" y="305">// system: active</tspan>
  </text>
</svg>
